
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDeck Digital Compass</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101810;
      color: #a5e8a5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 30px;
      text-align: center;
    }

    h1 {
      color: #b6ffb6;
      letter-spacing: 3px;
      font-size: 26px;
    }

    .status {
      color: #8aab8a;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .compass {
      width: 280px;
      height: 280px;
      border: 4px solid #73b573;
      border-radius: 50%;
      background: #1b291b;
      position: relative;
      margin: 30px auto;
      box-shadow: 0 0 25px #234d23;
    }

    .label {
      position: absolute;
      font-size: 22px;
      font-weight: bold;
      color: #b6ffb6;
    }

    .north {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff6666;
    }

    .south {
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
    }

    .east {
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
    }

    .west {
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
    }

    .needle {
      position: absolute;
      width: 20px;
      height: 180px;
      top: 46px;
      left: 126px;
      transform: rotate(0deg);
      transition: transform 0.3s ease;
    }

    .needle-north {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 90px solid #ff5555;
      position: absolute;
      top: 0;
      transform: rotate(180deg);
    }

    .needle-south {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 90px solid #dddddd;
      position: absolute;
      bottom: 0;
    }

    .center-dot {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #b6ffb6;
      border: 3px solid #101810;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .reading {
      margin-top: 30px;
      font-size: 34px;
      font-weight: bold;
      color: #b6ffb6;
    }

    .subtitle {
      font-size: 13px;
      color: #8aab8a;
      margin-top: 10px;
    }

    .slider-container {
      margin-top: 35px;
      padding: 20px;
      border: 1px solid #345534;
      border-radius: 10px;
      background: #172417;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 20px;
      accent-color: #80d080;
      cursor: pointer;
    }

    .slider-label {
      font-size: 14px;
      color: #b6ffb6;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #708970;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>DIGITAL COMPASS</h1>
    <p class="status">CYBERDECK NAVIGATION SYSTEM</p>

    <div class="compass">

      <span class="label north">N</span>
      <span class="label south">S</span>
      <span class="label east">E</span>
      <span class="label west">W</span>

      <div class="needle" id="needle">
        <div class="needle-north"></div>
        <div class="needle-south"></div>
      </div>

      <div class="center-dot"></div>

    </div>

    <div class="reading" id="direction">
      N 0°
    </div>

    <p class="subtitle">CURRENT HEADING</p>

    <div class="slider-container">

      <label class="slider-label" for="angleSlider">
        SIMULATED SENSOR READING
      </label>

      <input
        type="range"
        id="angleSlider"
        min="0"
        max="360"
        value="0"
        step="1"
      >

      <p id="degreeDisplay">0°</p>

    </div>

    <p class="footer">
      WiCS CyberDeck | Compass Simulation Mode
    </p>

  </div>

  <script>
    const needle = document.getElementById("needle");
    const directionText = document.getElementById("direction");
    const slider = document.getElementById("angleSlider");
    const degreeDisplay = document.getElementById("degreeDisplay");

    // Convert degrees into compass directions
    function getDirection(degrees) {
      const directions = [
        "N", "NE", "E", "SE",
        "S", "SW", "W", "NW"
      ];

      const index = Math.round(degrees / 45) % 8;

      return directions[index];
    }

    // Rotate the needle and update the text
    function updateCompass(degrees) {
      degrees = Number(degrees);

      needle.style.transform = `rotate(${degrees}deg)`;

      const direction = getDirection(degrees);

      directionText.textContent = `${direction} ${degrees}°`;
      degreeDisplay.textContent = `${degrees}°`;
    }

    // Fake sensor data controlled by the slider
    slider.addEventListener("input", function () {
      updateCompass(slider.value);
    });

    // Set the starting direction
    updateCompass(0);
  </script>

</body>
</html>
